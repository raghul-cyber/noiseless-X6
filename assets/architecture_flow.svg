<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="flow-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#141f36" stroke-width="0.7" opacity="0.5" />
    </pattern>

    <!-- Marker Arrowheads -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#00f0ff" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    @keyframes pulseDash {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-dash-cyan {
      stroke-dasharray: 6 5;
      animation: pulseDash 1.2s linear infinite;
    }
    .flow-dash-amber {
      stroke-dasharray: 6 5;
      animation: pulseDash 1.4s linear infinite;
    }
    .flow-dash-rose {
      stroke-dasharray: 6 5;
      animation: pulseDash 1.0s linear infinite;
    }
    .flow-dash-purple {
      stroke-dasharray: 6 5;
      animation: pulseDash 1.6s linear infinite;
    }
    .flow-dash-emerald {
      stroke-dasharray: 6 5;
      animation: pulseDash 1.1s linear infinite;
    }
    text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }
  </style>

  <!-- Background Base -->
  <rect width="1060" height="560" rx="16" fill="url(#flow-bg)" />
  <rect width="1060" height="560" rx="16" fill="url(#flow-grid)" />
  <rect x="2" y="2" width="1056" height="556" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Section Header (Clean & Centered) -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" fill="#38bdf8" font-size="19" font-weight="900" letter-spacing="1">NOISELESS-X6: COMPLETE END-TO-END HYBRID SIGNAL ARCHITECTURE</text>
    <text x="0" y="22" fill="#94a3b8" font-size="12" font-weight="500">
      Dual-Microphone ALSA Ingestion • Sub-Millisecond NLMS • Microsecond TinyImpulseMLP • ComplexCRN Deep Masking • Fusion Controller
    </text>
  </g>

  <!-- ==================== COLUMN 1: HARDWARE MICROPHONE INGESTION (x=40) ==================== -->
  <g transform="translate(40, 85)">
    <!-- Primary Mic Node (y=0, h=95) -->
    <rect x="0" y="0" width="165" height="95" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="16" cy="18" r="4.5" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="22" fill="#00f0ff" font-size="12" font-weight="800">PRIMARY MIC</text>
    <text x="14" y="44" fill="#e2e8f0" font-size="10.5" font-weight="600">Headset / Boom Mic</text>
    <text x="14" y="62" fill="#94a3b8" font-size="10">s[n] + v[n] (Speech+Noise)</text>
    <text x="14" y="80" fill="#38bdf8" font-size="9.5" font-family="monospace">16 kHz / 16-bit PCM</text>

    <!-- Reference Mic Node (y=120, h=95) -->
    <rect x="0" y="120" width="165" height="95" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="16" cy="138" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="142" fill="#38bdf8" font-size="12" font-weight="800">REFERENCE MIC</text>
    <text x="14" y="164" fill="#e2e8f0" font-size="10.5" font-weight="600">Ambient Error Mic</text>
    <text x="14" y="182" fill="#94a3b8" font-size="10">d[n] (Acoustic Noise)</text>
    <text x="14" y="200" fill="#38bdf8" font-size="9.5" font-family="monospace">Hardware ALSA hw:1,0</text>

    <!-- Lock-Free Ring Buffer Node (y=240, h=95) -->
    <rect x="0" y="240" width="165" height="95" rx="8" fill="#111c33" stroke="#64748b" stroke-width="1.2" />
    <text x="14" y="264" fill="#cbd5e1" font-size="11.5" font-weight="800">LOCK-FREE SPSC</text>
    <text x="14" y="284" fill="#94a3b8" font-size="10">Circular Ring Buffers</text>
    <text x="14" y="302" fill="#94a3b8" font-size="10">Atomic Read/Write Ptrs</text>
    <text x="14" y="320" fill="#00f0ff" font-size="9" font-family="monospace">5.0ms Hop (80 samples)</text>
  </g>

  <!-- Connectors from Column 1 to Column 2 (Evenly spaced) -->
  <path d="M 205 132 L 255 132" fill="none" stroke="#00f0ff" stroke-width="2" class="flow-dash-cyan" marker-end="url(#arrow-cyan)" />
  <path d="M 205 252 L 255 252" fill="none" stroke="#00f0ff" stroke-width="2" class="flow-dash-cyan" marker-end="url(#arrow-cyan)" />
  <path d="M 205 385 L 255 385" fill="none" stroke="#00f0ff" stroke-width="2" class="flow-dash-cyan" marker-end="url(#arrow-cyan)" />

  <!-- ==================== COLUMN 2: THREE-WAY PARALLEL ENGINE (x=255) ==================== -->
  
  <!-- PATH 1: CLASSICAL DSP (NLMS) (y=85, h=105) -->
  <g transform="translate(255, 85)">
    <rect x="0" y="0" width="230" height="105" rx="8" fill="#1c1608" stroke="#f59e0b" stroke-width="1.8" filter="url(#glow-amber)" />
    <circle cx="16" cy="20" r="4.5" fill="#f59e0b" />
    <text x="28" y="24" fill="#fbbf24" font-size="12.5" font-weight="800">PATH 1: DUAL-MIC NLMS</text>
    <text x="14" y="44" fill="#fef3c7" font-size="10" font-weight="600">Normalized Least Mean Squares</text>
    <text x="14" y="62" fill="#d97706" font-size="9.5" font-family="monospace">w[n+1] = w[n] + (μ/||u||²) e·u</text>
    <text x="14" y="80" fill="#d1d5db" font-size="9.5">Decorrelated Ref • Sub-ms Cancel</text>
    <text x="14" y="96" fill="#f59e0b" font-size="9.5" font-weight="700">Latency: &lt; 0.12 ms (ARM NEON)</text>
  </g>

  <!-- PATH 2: MICROSECOND IMPULSE DETECTOR (y=210, h=110) -->
  <g transform="translate(255, 210)">
    <rect x="0" y="0" width="230" height="110" rx="8" fill="#240e16" stroke="#f43f5e" stroke-width="1.8" filter="url(#glow-rose)" />
    <circle cx="16" cy="20" r="4.5" fill="#f43f5e" />
    <text x="28" y="24" fill="#fb7185" font-size="12.5" font-weight="800">PATH 2: IMPULSE DETECTOR</text>
    <text x="14" y="44" fill="#ffe4e6" font-size="10" font-weight="600">8-D Physical Acoustic Features</text>
    <text x="14" y="62" fill="#fda4af" font-size="9.5">RMS • Flux • Crest • ZCR • Subbands</text>
    <text x="14" y="80" fill="#f43f5e" font-size="9.5" font-weight="700">TinyImpulseMLP (305 Parameters)</text>
    <text x="14" y="98" fill="#fb7185" font-size="9.5" font-weight="700">Latency: &lt; 5 µs • 100% Precision</text>
  </g>

  <!-- PATH 3: DEEP LEARNING (COMPLEX-CRN) (y=340, h=155) -->
  <g transform="translate(255, 340)">
    <rect x="0" y="0" width="230" height="155" rx="8" fill="#1e1035" stroke="#a855f7" stroke-width="1.8" filter="url(#glow-purple)" />
    <circle cx="16" cy="20" r="4.5" fill="#c084fc" />
    <text x="28" y="24" fill="#c084fc" font-size="12.5" font-weight="800">PATH 3: ComplexCRN NEURAL</text>
    <text x="14" y="46" fill="#f3e8ff" font-size="10" font-weight="600">Dual-Channel STFT (Real / Imag)</text>
    <text x="14" y="64" fill="#e9d5ff" font-size="9.5">Complex Conv2D Encoder (U-Net Skips)</text>
    <text x="14" y="82" fill="#e9d5ff" font-size="9.5">Paired Complex GRU (Recurrent Memory)</text>
    <text x="14" y="100" fill="#a855f7" font-size="9.5" font-family="monospace">Bounded Mask: M_hat = M_R + jM_I</text>
    <text x="14" y="118" fill="#d8b4fe" font-size="9.5">Enhanced Spectrum: S_hat = M * X</text>
    <text x="14" y="136" fill="#38bdf8" font-size="9.5" font-weight="700">INT8 Latency: 0.765 ms (RTF 0.153x)</text>
  </g>

  <!-- Connectors from Column 2 to Column 3 (Hybrid Fusion Controller) -->
  <!-- From NLMS to Fusion -->
  <path d="M 485 137 L 540 137 L 540 225 L 565 225" fill="none" stroke="#f59e0b" stroke-width="2" class="flow-dash-amber" marker-end="url(#arrow-amber)" />
  <rect x="492" y="125" width="46" height="16" rx="3" fill="#1c1608" />
  <text x="515" y="137" fill="#f59e0b" font-size="9" font-weight="700" text-anchor="middle">e_nlms</text>

  <!-- From Impulse Detector to Fusion -->
  <path d="M 485 265 L 565 265" fill="none" stroke="#f43f5e" stroke-width="2.2" class="flow-dash-rose" marker-end="url(#arrow-rose)" />
  <rect x="492" y="253" width="62" height="16" rx="3" fill="#240e16" />
  <text x="523" y="265" fill="#f43f5e" font-size="9" font-weight="700" text-anchor="middle">Impulse P</text>

  <!-- From ComplexCRN to Fusion -->
  <path d="M 485 417 L 540 417 L 540 305 L 565 305" fill="none" stroke="#a855f7" stroke-width="2" class="flow-dash-purple" marker-end="url(#arrow-purple)" />
  <rect x="492" y="405" width="46" height="16" rx="3" fill="#1e1035" />
  <text x="515" y="417" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle">S_ai(f)</text>

  <!-- ==================== COLUMN 3: HYBRID FUSION CONTROLLER (x=565, y=165) ==================== -->
  <g transform="translate(565, 165)">
    <rect x="0" y="0" width="240" height="215" rx="10" fill="#091d24" stroke="#00ff88" stroke-width="2" filter="url(#glow-emerald)" />
    <circle cx="20" cy="24" r="5" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="28" fill="#00ff88" font-size="13" font-weight="900">HYBRID FUSION CONTROLLER</text>
    
    <text x="14" y="54" fill="#a7f3d0" font-size="10.5" font-weight="700">Dynamic Spectral Blending:</text>
    <rect x="14" y="62" width="212" height="26" rx="4" fill="#064e3b" />
    <text x="20" y="79" fill="#6ee7b7" font-size="10" font-family="monospace">S_fused = λ·S_ai + (1-λ)·S_nlms</text>

    <text x="14" y="108" fill="#a7f3d0" font-size="10.5" font-weight="700">Transient Clamping Envelope:</text>
    <text x="14" y="124" fill="#d1fae5" font-size="9.5">Fast Attack &lt; 100µs • Exp Decay</text>
    <text x="14" y="140" fill="#34d399" font-size="9.5" font-family="monospace">Gain Floor: g_impulse = 0.05</text>

    <text x="14" y="168" fill="#a7f3d0" font-size="10.5" font-weight="700">6-State Fault Machine:</text>
    <text x="14" y="184" fill="#6ee7b7" font-size="9.5">NORMAL • IMPULSE_PROTECT</text>
    <text x="14" y="200" fill="#6ee7b7" font-size="9.5">DEGRADED • NLMS_FAULT • BYPASS</text>
  </g>

  <!-- Connector from Fusion to Column 4 (iSTFT Synthesis) -->
  <path d="M 805 272 L 865 272" fill="none" stroke="#00ff88" stroke-width="2.5" class="flow-dash-emerald" marker-end="url(#arrow-emerald)" />
  <rect x="814" y="260" width="46" height="16" rx="3" fill="#091d24" />
  <text x="837" y="272" fill="#00ff88" font-size="9" font-weight="700" text-anchor="middle">S_fused</text>

  <!-- ==================== COLUMN 4: SYNTHESIS & PLAYBACK (x=865) ==================== -->
  <g transform="translate(865, 165)">
    <!-- iSTFT Overlap-Add Node (y=0, h=95) -->
    <rect x="0" y="55" width="160" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="14" y="78" fill="#38bdf8" font-size="12" font-weight="800">iSTFT SYNTHESIS</text>
    <text x="14" y="96" fill="#e2e8f0" font-size="10">Overlap-Add (OLA)</text>
    <text x="14" y="112" fill="#94a3b8" font-size="9.5">Hann Window N=512</text>
    <text x="14" y="128" fill="#38bdf8" font-size="9" font-family="monospace">COLA Verified (&gt;100dB)</text>

    <!-- Connector: iSTFT -> ALSA Playback -->
    <path d="M 80 140 L 80 165" fill="none" stroke="#00ff88" stroke-width="2" class="flow-dash-emerald" marker-end="url(#arrow-emerald)" />

    <!-- ALSA Output Node (y=165, h=85) -->
    <rect x="0" y="165" width="160" height="85" rx="8" fill="#06281e" stroke="#10b981" stroke-width="2" filter="url(#glow-emerald)" />
    <circle cx="16" cy="184" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="188" fill="#34d399" font-size="12" font-weight="800">ALSA PLAYBACK</text>
    <text x="14" y="208" fill="#ecfdf5" font-size="10" font-weight="600">Hardware PCM Out</text>
    <text x="14" y="226" fill="#a7f3d0" font-size="9.5">Enhanced Speech y[n]</text>
    <text x="14" y="242" fill="#34d399" font-size="9" font-weight="700">Zero Overruns Guaranteed</text>
  </g>

  <!-- Bottom Global Footnote -->
  <g transform="translate(40, 525)">
    <line x1="0" y1="0" x2="985" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="10" y="18" fill="#64748b" font-size="11" font-family="monospace">
      HOP BUDGET: 5.0 ms | MEASURED INT8 LATENCY: 0.765 ms | TOTAL PIPELINE LATENCY: &lt; 15.0 ms | CPU HEADROOM: 84.7%
    </text>
  </g>
</svg>
