<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <linearGradient id="noisy-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>

    <linearGradient id="clean-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162238" stroke-width="0.75" opacity="0.6" />
    </pattern>

    <!-- Marker Arrowheads -->
    <marker id="hero-arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ff3366" />
    </marker>
    <marker id="hero-arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#00ff88" />
    </marker>
  </defs>

  <style>
    @keyframes dashStream {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    .neon-title {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: 6px;
    }
    .laser-dash {
      stroke-dasharray: 8 6;
      animation: dashStream 1.2s linear infinite;
    }
    text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1000" height="360" rx="16" fill="url(#cyber-grid)" />

  <!-- Cyber Border Frame -->
  <rect x="2" y="2" width="996" height="356" rx="14" fill="none" stroke="#1f2f4d" stroke-width="1.5" />
  <path d="M 2 40 L 40 2 M 998 40 L 960 2 M 2 320 L 40 358 M 998 320 L 960 358" stroke="#00f0ff" stroke-width="2.5" fill="none" opacity="0.8" />

  <!-- Top Badges Ribbon (Evenly spaced & aligned) -->
  <g transform="translate(40, 26)">
    <!-- Real-Time Badge -->
    <rect x="0" y="0" width="145" height="24" rx="12" fill="#13233a" stroke="#00f0ff" stroke-width="1" />
    <circle cx="14" cy="12" r="4.5" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="16" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="700">16 kHz / 5.0ms HOP</text>

    <!-- Architecture Badge -->
    <rect x="160" y="0" width="185" height="24" rx="12" fill="#1b1736" stroke="#7000ff" stroke-width="1" />
    <text x="172" y="16" fill="#c084fc" font-family="monospace" font-size="10" font-weight="700">DUAL-PATH HYBRID AI+NLMS</text>

    <!-- Hardware Badge -->
    <rect x="360" y="0" width="180" height="24" rx="12" fill="#241424" stroke="#ff007f" stroke-width="1" />
    <text x="372" y="16" fill="#ff77bb" font-family="monospace" font-size="10" font-weight="700">RASPBERRY PI 4/5 ARM64</text>

    <!-- Verification Badge -->
    <rect x="735" y="0" width="185" height="24" rx="12" fill="#0c261e" stroke="#00ff88" stroke-width="1" />
    <circle cx="749" cy="12" r="4.5" fill="#00ff88" />
    <text x="760" y="16" fill="#00ff88" font-family="monospace" font-size="10" font-weight="700">100% ZERO-MOCK VALIDATED</text>
  </g>

  <!-- Title & Subtitle Banner (Centered) -->
  <g transform="translate(500, 96)" text-anchor="middle">
    <text class="neon-title" x="0" y="0" font-size="42" fill="url(#title-grad)" filter="url(#glow-cyan)">NOISELESS-X6</text>
    <text x="0" y="24" fill="#94a3b8" font-size="12.5" font-weight="600" letter-spacing="3">
      DUAL-MICROPHONE ADAPTIVE ACOUSTIC SPEECH ENHANCEMENT ENGINE
    </text>
  </g>

  <!-- ==================== WAVEFORM WORKFLOW (LEFT -> CENTER -> RIGHT) ==================== -->

  <!-- LEFT: Input Noisy Waveform Section (x=40, y=145, w=380, h=120) -->
  <g transform="translate(40, 145)">
    <!-- Label -->
    <rect x="0" y="0" width="150" height="22" rx="4" fill="#2d1219" stroke="#ff3366" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#ff3366" />
    <text x="22" y="15" fill="#ff4d79" font-family="monospace" font-size="10" font-weight="800">INPUT: NOISY (SNR &lt; 0dB)</text>

    <!-- Clipping Box for Seamless Moving Waveform -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="375" height="65" rx="8" fill="#120c15" stroke="#381a29" stroke-width="1.2" />
      <svg x="5" y="5" width="365" height="55" viewBox="0 0 365 55">
        <!-- Seamless repeating waveform translated by exact multiple of wavelength (120px) -->
        <g>
          <path d="M 0 27 Q 15 -3 30 27 T 60 27 T 75 52 T 90 27 T 105 1 T 120 27 T 135 52 T 150 27 T 165 -3 T 180 27 T 195 52 T 210 27 T 225 1 T 240 27 T 255 52 T 270 27 T 285 -3 T 300 27 T 315 5 T 330 27 T 345 52 T 360 27" fill="none" stroke="url(#noisy-grad)" stroke-width="2.2" filter="url(#glow-red)" />
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="2s" repeatCount="indefinite" />
        </g>
      </svg>
    </g>
  </g>

  <!-- Signal Flowing Arrow: Left -> Center Core -->
  <path d="M 425 207 L 452 207" fill="none" stroke="#ff3366" stroke-width="2" class="laser-dash" marker-end="url(#hero-arrow-red)" />

  <!-- CENTER: Central Processing Core Node (Centered at x=500, y=207) -->
  <g transform="translate(500, 207)">
    <!-- Pulsing Outer Aura -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="#00f0ff" stroke-width="1.5">
      <animate attributeName="r" values="40;48;40" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.4s" repeatCount="indefinite" />
    </circle>

    <!-- Rotating Cyber Ring (Native SVG Centered Rotation) -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="#7000ff" stroke-width="2" stroke-dasharray="14 8 6 8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- Core Hub Body -->
    <circle cx="0" cy="0" r="28" fill="#091322" stroke="#00ff88" stroke-width="2" />

    <!-- Microchip Waveform Glyph -->
    <path d="M -8 0 L -4 6 L 0 -6 L 4 8 L 8 0" fill="none" stroke="#00ff88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="-12" text-anchor="middle" fill="#ffffff" font-size="7" font-weight="800">FUSION</text>
    <text x="0" y="44" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="700">RTF: 0.153x</text>
  </g>

  <!-- Signal Flowing Arrow: Center Core -> Right -->
  <path d="M 548 207 L 575 207" fill="none" stroke="#00ff88" stroke-width="2" class="laser-dash" marker-end="url(#hero-arrow-green)" />

  <!-- RIGHT: Output Clean Waveform Section (x=585, y=145, w=375, h=120) -->
  <g transform="translate(585, 145)">
    <!-- Label -->
    <rect x="0" y="0" width="160" height="22" rx="4" fill="#082b1d" stroke="#00ff88" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#00ff88" />
    <text x="22" y="15" fill="#00ff88" font-family="monospace" font-size="10" font-weight="800">OUTPUT: ENHANCED SPEECH</text>

    <!-- Clipping Box for Moving Clean Waveform -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="375" height="65" rx="8" fill="#081716" stroke="#133d32" stroke-width="1.2" />
      <svg x="5" y="5" width="365" height="55" viewBox="0 0 365 55">
        <!-- Smooth Clean Harmonic Speech Contours (Seamless 120px loop) -->
        <g>
          <path d="M 0 27 C 20 7, 40 7, 60 27 C 80 47, 100 47, 120 27 C 140 7, 160 7, 180 27 C 200 47, 220 47, 240 27 C 260 7, 280 7, 300 27 C 320 47, 340 47, 360 27 C 380 7, 400 7, 420 27 C 440 47, 460 47, 480 27" fill="none" stroke="url(#clean-grad)" stroke-width="2.6" filter="url(#glow-green)" />
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="2s" repeatCount="indefinite" />
        </g>
      </svg>
    </g>
  </g>

  <!-- ==================== BOTTOM TELEMETRY TICKER ==================== -->
  <g transform="translate(40, 305)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#1e2d47" stroke-width="1" />

    <g transform="translate(10, 22)">
      <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="10.5">MODEL:</text>
      <text x="50" y="0" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="700">ComplexCRN (1.44M Params, INT8 4.16MB)</text>

      <text x="360" y="0" fill="#64748b" font-family="monospace" font-size="10.5">TRANSIENT CLAMP:</text>
      <text x="480" y="0" fill="#a78bfa" font-family="monospace" font-size="10.5" font-weight="700">TinyImpulseMLP (&lt; 5µs, 100% Prec)</text>

      <text x="735" y="0" fill="#64748b" font-family="monospace" font-size="10.5">STREAMING GAP:</text>
      <text x="840" y="0" fill="#34d399" font-family="monospace" font-size="10.5" font-weight="700">2.15e-06</text>
    </g>
  </g>
</svg>
