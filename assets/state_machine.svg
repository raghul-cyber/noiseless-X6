<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="sm-glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="sm-glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="sm-glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="sm-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#162238" stroke-width="0.6" opacity="0.5" />
    </pattern>

    <!-- Marker Arrowheads -->
    <marker id="sm-arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="sm-arrow-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="sm-arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="sm-arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <style>
    @keyframes pulseDashFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .transit-dash {
      stroke-dasharray: 6 4;
      animation: pulseDashFlow 1.2s linear infinite;
    }
    text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }
  </style>

  <!-- Background Base -->
  <rect width="960" height="480" rx="14" fill="url(#sm-bg)" />
  <rect width="960" height="480" rx="14" fill="url(#sm-grid)" />
  <rect x="2" y="2" width="956" height="476" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- ==================== HEADER (CLEAN & SEPARATE) ==================== -->
  <g transform="translate(50, 42)">
    <rect x="0" y="-18" width="860" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="20" cy="6" r="5" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="11" fill="#38bdf8" font-size="16" font-weight="900" letter-spacing="1">NOISELESS-X6: HYBRID FUSION 6-STATE REAL-TIME FAULT MACHINE</text>
    <text x="640" y="11" fill="#94a3b8" font-size="11" font-weight="600">Hardware ALSA &amp; Dynamic Failover</text>
  </g>

  <!-- ==================== CONNECTOR LINES & LABELS (DRAWN FIRST) ==================== -->

  <!-- NORMAL -> IMPULSE_PROTECT (Upper forward, Rose) -->
  <path d="M 600 135 L 670 135" fill="none" stroke="#f43f5e" stroke-width="2" class="transit-dash" marker-end="url(#sm-arrow-rose)" />
  <rect x="606" y="114" width="58" height="18" rx="3" fill="#290b16" stroke="#f43f5e" stroke-width="0.8" />
  <text x="635" y="127" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">P &gt; 0.85</text>

  <!-- IMPULSE_PROTECT -> NORMAL (Upper return, Green) -->
  <path d="M 670 180 L 600 180" fill="none" stroke="#10b981" stroke-width="2" class="transit-dash" marker-end="url(#sm-arrow-green)" />
  <rect x="604" y="185" width="62" height="18" rx="3" fill="#06281e" stroke="#10b981" stroke-width="0.8" />
  <text x="635" y="198" fill="#34d399" font-size="8.5" font-weight="700" text-anchor="middle">Decayed</text>

  <!-- NORMAL -> BYPASS (Upper left, Slate) -->
  <path d="M 360 157 L 290 157" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#sm-arrow-slate)" />
  <rect x="296" y="146" width="58" height="18" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="0.8" />
  <text x="325" y="159" fill="#cbd5e1" font-size="9" font-weight="600" text-anchor="middle">Manual</text>

  <!-- NORMAL -> NLMS_FAULT (Vertical down, Purple) -->
  <path d="M 480 215 L 480 285" fill="none" stroke="#a855f7" stroke-width="1.8" marker-end="url(#sm-arrow-slate)" />
  <rect x="425" y="241" width="110" height="18" rx="3" fill="#1e1035" stroke="#a855f7" stroke-width="0.8" />
  <text x="480" y="254" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle">NLMS Divergence</text>

  <!-- NORMAL -> DEGRADED (Stepped down-right, Amber) -->
  <path d="M 570 215 L 570 250 L 730 250 L 730 285" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#sm-arrow-slate)" />
  <rect x="600" y="241" width="100" height="18" rx="3" fill="#241908" stroke="#f59e0b" stroke-width="0.8" />
  <text x="650" y="254" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">AI Latency &gt; 5.0ms</text>

  <!-- NLMS_FAULT -> ERROR (Bottom left, Red) -->
  <path d="M 360 342 L 290 342" fill="none" stroke="#ef4444" stroke-width="1.8" marker-end="url(#sm-arrow-red)" />
  <rect x="295" y="331" width="60" height="18" rx="3" fill="#240c0c" stroke="#ef4444" stroke-width="0.8" />
  <text x="325" y="344" fill="#f87171" font-size="8.5" font-weight="700" text-anchor="middle">ALSA Crash</text>

  <!-- ==================== 6 STATE NODES (2 x 3 GRID) ==================== -->

  <!-- 1. STATE: BYPASS (Top-Left: x=50, y=100) -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="240" height="115" rx="10" fill="#0b1324" stroke="#475569" stroke-width="1.5" />
    <circle cx="20" cy="24" r="5" fill="#64748b" />
    <text x="36" y="28" fill="#e2e8f0" font-size="13" font-weight="800">STATE: BYPASS</text>
    
    <text x="16" y="52" fill="#94a3b8" font-size="10.5" font-weight="600">Zero-Processing Pass-Through</text>
    <text x="16" y="70" fill="#64748b" font-size="9.5">Primary Mic Signal Direct to Out</text>
    <rect x="16" y="80" width="208" height="22" rx="4" fill="#1e293b" />
    <text x="24" y="95" fill="#38bdf8" font-size="9.5" font-family="monospace">Latency: &lt; 0.05 ms (Bypassed)</text>
  </g>

  <!-- 2. STATE: NORMAL (Top-Center: x=360, y=100) - THE MAIN ACTIVE ENGINE -->
  <g transform="translate(360, 100)">
    <!-- Outer Pulsing Glow Aura -->
    <rect x="-4" y="-4" width="248" height="123" rx="14" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite" />
    </rect>

    <!-- Main Card Body -->
    <rect x="0" y="0" width="240" height="115" rx="10" fill="#042318" stroke="#10b981" stroke-width="2" filter="url(#sm-glow-green)">
      <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite" />
    </rect>
    <circle cx="20" cy="24" r="5" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="r" values="5;6.5;5" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="28" fill="#00ff88" font-size="13.5" font-weight="900">STATE: NORMAL (ACTIVE)</text>
    
    <text x="16" y="52" fill="#d1fae5" font-size="10.5" font-weight="700">Dual-Path Active Blending</text>
    <text x="16" y="70" fill="#a7f3d0" font-size="9.5">Dynamic λ(t) Convex Fusion</text>
    
    <rect x="16" y="80" width="208" height="24" rx="4" fill="#064e3b" />
    <text x="22" y="96" fill="#6ee7b7" font-size="10" font-family="monospace">S = λ·S_ai + (1-λ)·S_nlms</text>
  </g>

  <!-- 3. STATE: IMPULSE_PROTECT (Top-Right: x=670, y=100) -->
  <g transform="translate(670, 100)">
    <rect x="0" y="0" width="240" height="115" rx="10" fill="#2b0a16" stroke="#f43f5e" stroke-width="2" filter="url(#sm-glow-rose)" />
    <circle cx="20" cy="24" r="5" fill="#f43f5e" />
    <text x="36" y="28" fill="#fb7185" font-size="13" font-weight="800">IMPULSE_PROTECT</text>
    
    <text x="16" y="52" fill="#ffe4e6" font-size="10.5" font-weight="700">Transient Clamping Envelope</text>
    <text x="16" y="70" fill="#fecdd3" font-size="9.5">Attack &lt; 100µs • Exp Decay 0.85</text>
    
    <rect x="16" y="80" width="208" height="22" rx="4" fill="#4c0519" />
    <text x="24" y="95" fill="#f43f5e" font-size="9.5" font-family="monospace">Gain Floor: 0.05 (-26.0 dB)</text>
  </g>

  <!-- 4. STATE: ERROR (Bottom-Left: x=50, y=285) -->
  <g transform="translate(50, 285)">
    <rect x="0" y="0" width="240" height="115" rx="10" fill="#200a0a" stroke="#dc2626" stroke-width="1.8" />
    <circle cx="20" cy="24" r="5" fill="#dc2626" />
    <text x="36" y="28" fill="#f87171" font-size="13" font-weight="800">STATE: ERROR (MUTE)</text>
    
    <text x="16" y="52" fill="#fee2e2" font-size="10.5" font-weight="600">Hardware ALSA Disconnect</text>
    <text x="16" y="70" fill="#fca5a5" font-size="9.5">Zero-Output Failsafe Clamp</text>
    
    <rect x="16" y="80" width="208" height="22" rx="4" fill="#450a0a" />
    <text x="24" y="95" fill="#ef4444" font-size="9.5" font-family="monospace">Prevents Feedback Squeal</text>
  </g>

  <!-- 5. STATE: NLMS_FAULT (Bottom-Center: x=360, y=285) -->
  <g transform="translate(360, 285)">
    <rect x="0" y="0" width="240" height="115" rx="10" fill="#1a0d2e" stroke="#a855f7" stroke-width="1.8" />
    <circle cx="20" cy="24" r="5" fill="#c084fc" />
    <text x="36" y="28" fill="#c084fc" font-size="13" font-weight="800">NLMS_FAULT (AI-ONLY)</text>
    
    <text x="16" y="52" fill="#f3e8ff" font-size="10.5" font-weight="700">Filter Divergence / Leakage</text>
    <text x="16" y="70" fill="#d8b4fe" font-size="9.5">Adaptive Weights Safeguard</text>
    
    <rect x="16" y="80" width="208" height="22" rx="4" fill="#3b0764" />
    <text x="24" y="95" fill="#a855f7" font-size="9.5" font-family="monospace">λ = 1.0 (Pure Neural Mask)</text>
  </g>

  <!-- 6. STATE: DEGRADED (Bottom-Right: x=670, y=285) -->
  <g transform="translate(670, 285)">
    <rect x="0" y="0" width="240" height="115" rx="10" fill="#241705" stroke="#f59e0b" stroke-width="1.8" filter="url(#sm-glow-amber)" />
    <circle cx="20" cy="24" r="5" fill="#f59e0b" />
    <text x="36" y="28" fill="#fbbf24" font-size="13" font-weight="800">DEGRADED (NLMS-ONLY)</text>
    
    <text x="16" y="52" fill="#fef3c7" font-size="10.5" font-weight="700">AI Latency Timeout &gt; 5.0ms</text>
    <text x="16" y="70" fill="#fde68a" font-size="9.5">Sub-ms Classical Linear Filter</text>
    
    <rect x="16" y="80" width="208" height="22" rx="4" fill="#451a03" />
    <text x="24" y="95" fill="#f59e0b" font-size="9.5" font-family="monospace">λ = 0.0 (Zero Dropout Gate)</text>
  </g>

  <!-- ==================== BOTTOM SPECIFICATION FOOTER ==================== -->
  <g transform="translate(50, 442)">
    <line x1="0" y1="0" x2="860" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="10" y="18" fill="#64748b" font-size="10.5" font-family="monospace">
      HYSTERESIS: 50-Frame Anti-Chattering Hold (250ms) • ATTACK: &lt; 100µs • DECAY: 0.85/frame • GAIN FLOOR: -26.0 dB
    </text>
  </g>
</svg>
