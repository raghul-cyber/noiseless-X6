<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <linearGradient id="bar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="bar-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="bar-rose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="hud-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#162238" stroke-width="0.5" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .hud-title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .hud-stat {
      font-family: 'Segoe UI', monospace;
      font-weight: 900;
    }
    text {
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
  </style>

  <!-- Background Base -->
  <rect width="980" height="300" rx="14" fill="url(#hud-bg)" />
  <rect width="980" height="300" rx="14" fill="url(#hud-grid)" />
  <rect x="2" y="2" width="976" height="296" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(30, 32)">
    <text x="0" y="0" fill="#38bdf8" font-size="16" font-weight="900" letter-spacing="1">NOISELESS-X6: EMPIRICAL TELEMETRY DASHBOARD</text>
    <text x="420" y="0" fill="#64748b" font-size="11" font-family="monospace">Zero Estimations • 100% Live In-Circuit Audio Verification</text>
  </g>

  <!-- ==================== 4 METRIC CARDS (PERFECTLY BALANCED) ==================== -->

  <!-- CARD 1: LATENCY & RTF (x=30) -->
  <g transform="translate(30, 52)">
    <rect x="0" y="0" width="215" height="212" rx="10" fill="#0b1326" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="16" cy="18" r="3.5" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="22" fill="#38bdf8" class="hud-title" font-size="11">STREAMING LATENCY</text>
    
    <text x="14" y="58" fill="#ffffff" class="hud-stat" font-size="28">0.765 ms</text>
    <text x="14" y="76" fill="#38bdf8" font-size="10.5" font-weight="700">INT8 ONNX (RTF: 0.153x)</text>

    <text x="14" y="102" fill="#94a3b8" font-size="10">FP32 Latency: 3.234 ms (0.647x)</text>
    <text x="14" y="118" fill="#94a3b8" font-size="10">Audio Hop Budget: 5.000 ms</text>

    <!-- Headroom Progress Gauge -->
    <text x="14" y="146" fill="#64748b" font-size="9.5" font-weight="700">CPU HEADROOM MARGIN</text>
    <rect x="14" y="154" width="187" height="12" rx="6" fill="#1e293b" />
    <rect x="14" y="154" width="158" height="12" rx="6" fill="url(#bar-cyan)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="14" y="184" fill="#38bdf8" font-size="11" font-weight="800">84.7% Headroom (INT8)</text>
  </g>

  <!-- CARD 2: SPEECH INTELLIGIBILITY & STOI (x=265) -->
  <g transform="translate(265, 52)">
    <rect x="0" y="0" width="215" height="212" rx="10" fill="#071d18" stroke="#10b981" stroke-width="1.5" />
    <circle cx="16" cy="18" r="3.5" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="22" fill="#34d399" class="hud-title" font-size="11">SPEECH INTELLIGIBILITY</text>
    
    <text x="14" y="58" fill="#ffffff" class="hud-stat" font-size="28">0.7380</text>
    <text x="14" y="76" fill="#34d399" font-size="10.5" font-weight="700">STOI Score (VoiceBank Held-Out)</text>

    <text x="14" y="102" fill="#a7f3d0" font-size="10">SI-SNR Enhanced: +1.55 dB</text>
    <text x="14" y="118" fill="#a7f3d0" font-size="10">Energy Pres: 2.339 (+3.69 dB)</text>

    <!-- Preservation Gauge -->
    <text x="14" y="146" fill="#64748b" font-size="9.5" font-weight="700">PRESERVATION INTEGRITY</text>
    <rect x="14" y="154" width="187" height="12" rx="6" fill="#1e293b" />
    <rect x="14" y="154" width="168" height="12" rx="6" fill="url(#bar-green)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="14" y="184" fill="#00ff88" font-size="11" font-weight="800">Zero Speech Over-Suppression</text>
  </g>

  <!-- CARD 3: IMPULSE CLASSIFIER (x=500) -->
  <g transform="translate(500, 52)">
    <rect x="0" y="0" width="215" height="212" rx="10" fill="#240c16" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="16" cy="18" r="3.5" fill="#f43f5e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="22" fill="#fb7185" class="hud-title" font-size="11">IMPULSE DETECTOR</text>
    
    <text x="14" y="58" fill="#ffffff" class="hud-stat" font-size="28">100.0%</text>
    <text x="14" y="76" fill="#fb7185" font-size="10.5" font-weight="700">Precision (0 False Positives)</text>

    <text x="14" y="102" fill="#fecdd3" font-size="10">Inference: &lt; 5 µs (305 Params)</text>
    <text x="14" y="118" fill="#fecdd3" font-size="10">Spot-Check: 95.0% (19/20 Passed)</text>

    <!-- F1 Score Gauge -->
    <text x="14" y="146" fill="#64748b" font-size="9.5" font-weight="700">CONFUSION (300 TN / 166 TP)</text>
    <rect x="14" y="154" width="187" height="12" rx="6" fill="#1e293b" />
    <rect x="14" y="154" width="145" height="12" rx="6" fill="url(#bar-rose)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="14" y="184" fill="#fb7185" font-size="11" font-weight="800">F1-Score: 0.7124</text>
  </g>

  <!-- CARD 4: PIPELINE VERIFICATION (x=735) -->
  <g transform="translate(735, 52)">
    <rect x="0" y="0" width="215" height="212" rx="10" fill="#1a102e" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="16" cy="18" r="3.5" fill="#c084fc">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="22" fill="#c084fc" class="hud-title" font-size="11">PIPELINE INTEGRITY</text>
    
    <text x="14" y="58" fill="#ffffff" class="hud-stat" font-size="28">93 / 93</text>
    <text x="14" y="76" fill="#c084fc" font-size="10.5" font-weight="700">Unit Tests Passing (100%)</text>

    <text x="14" y="102" fill="#e9d5ff" font-size="10">Streaming Gap: 2.15e-06 (&lt; 1e-3)</text>
    <text x="14" y="118" fill="#e9d5ff" font-size="10">Data Leakage: 0 Overlapping Files</text>

    <!-- Test Pass Gauge -->
    <text x="14" y="146" fill="#64748b" font-size="9.5" font-weight="700">CODEBASE INTEGRITY</text>
    <rect x="14" y="154" width="187" height="12" rx="6" fill="#1e293b" />
    <rect x="14" y="154" width="187" height="12" rx="6" fill="url(#bar-purple)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="14" y="184" fill="#a855f7" font-size="11" font-weight="800">100% Quality Gates Passed</text>
  </g>

  <!-- Footer -->
  <g transform="translate(30, 280)">
    <text x="0" y="0" fill="#475569" font-size="9.5" font-family="monospace">
      DATASETS AUDITED: VoiceBank • DEMAND • VCTK • LibriSpeech • MUSAN • RIRS_NOISES • ESC-50 • UrbanSound8K
    </text>
  </g>
</svg>
