<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="time-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0c1424" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Headroom Striped Pattern -->
    <pattern id="headroom-stripes" width="16" height="16" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#00ff88" stroke-width="2.5" opacity="0.3" />
    </pattern>

    <!-- Scanning Laser Filter -->
    <filter id="glow-laser" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanSweep {
      0% { transform: translateX(0px); opacity: 0.2; }
      15% { opacity: 1; }
      50% { transform: translateX(186px); opacity: 1; }
      55% { transform: translateX(186px); opacity: 0; }
      100% { transform: translateX(0px); opacity: 0; }
    }
    @keyframes pulseLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .laser-scanner {
      animation: scanSweep 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .pulse-dot {
      animation: pulseLed 1.2s infinite ease-in-out;
    }
  </style>

  <!-- Background Base -->
  <rect width="1060" height="320" rx="14" fill="url(#time-bg)" />
  <rect x="2" y="2" width="1056" height="316" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 34)">
    <circle cx="8" cy="-6" r="5" fill="#00ff88" class="pulse-dot" />
    <text x="24" y="-2" fill="#38bdf8" font-size="16" font-weight="900" letter-spacing="1">NOISELESS-X6: HARD REAL-TIME 5.0ms HOP BUDGET EXECUTION TIMELINE</text>
    <text x="740" y="-2" fill="#94a3b8" font-size="11.5" class="mono">Raspberry Pi 4/5 (ARM64 Linux)</text>
    <text x="24" y="16" fill="#64748b" font-size="11">Sub-hop deterministic DSP &amp; ONNX INT8 neural execution measured across 10,000+ continuous frames</text>
  </g>

  <!-- ==================== MAIN TIMELINE BAR (x=36, y=86, w=988, h=56) ==================== -->
  <g transform="translate(36, 86)">
    <!-- Timeline Track Background (Total 5.000 ms = 988 px => 197.6 px per ms) -->
    <rect x="0" y="0" width="988" height="56" rx="8" fill="#0b1322" stroke="#1e293b" stroke-width="1.5" />

    <!-- 1. ALSA Ring Fetch (0.015ms -> ~3px) -->
    <rect x="0" y="0" width="4" height="56" rx="2" fill="#00f0ff" />

    <!-- 2. Dual-Mic NLMS Filter (0.118ms -> ~23px) -->
    <rect x="4" y="0" width="23" height="56" fill="#f59e0b" />

    <!-- 3. Physical 8-D Features + TinyImpulseMLP (0.005ms -> ~2px) -->
    <rect x="27" y="0" width="3" height="56" fill="#f43f5e" />

    <!-- 4. ComplexCRN Neural Masking (0.765ms -> ~151px) -->
    <rect x="30" y="0" width="151" height="56" fill="#a855f7" />

    <!-- 5. Hybrid Fusion Controller (0.008ms -> ~2px) -->
    <rect x="181" y="0" width="2" height="56" fill="#10b981" />

    <!-- 6. iSTFT Overlap-Add (0.042ms -> ~8px) -->
    <rect x="183" y="0" width="8" height="56" fill="#38bdf8" />

    <!-- Total Execution Point marker at 191px (0.953 ms) -->
    <line x1="191" y1="-8" x2="191" y2="64" stroke="#ff007f" stroke-width="2" stroke-dasharray="3 3" />

    <!-- 7. Headroom Margin (4.047ms -> 797px, 80.9% Headroom) -->
    <rect x="191" y="0" width="797" height="56" fill="url(#headroom-stripes)" rx="0" />
    <rect x="191" y="0" width="797" height="56" fill="#064e3b" opacity="0.35" rx="0" />

    <!-- Animated Scanning Laser Bar -->
    <g class="laser-scanner">
      <line x1="0" y1="0" x2="0" y2="56" stroke="#00f0ff" stroke-width="3" filter="url(#glow-laser)" />
    </g>

    <!-- Stage Indicators on the Bar -->
    <text x="14" y="34" fill="#1e1035" font-size="10" font-weight="900" transform="rotate(-90 14 34)">NLMS</text>
    <text x="68" y="34" fill="#ffffff" font-size="11" font-weight="800">ComplexCRN (0.765 ms)</text>
    <text x="450" y="34" fill="#34d399" font-size="13" font-weight="900" letter-spacing="1">
      80.9% CPU HEADROOM MARGIN (4.047 ms IDLE / SYSTEM HEADROOM)
    </text>

    <!-- Boundary Markers (0ms, 1ms, 2ms, 3ms, 4ms, 5ms) -->
    <line x1="0" y1="56" x2="0" y2="68" stroke="#64748b" stroke-width="1.5" />
    <text x="0" y="80" fill="#64748b" font-size="10" class="mono" text-anchor="middle">0.0 ms</text>

    <line x1="197.6" y1="56" x2="197.6" y2="64" stroke="#334155" stroke-width="1" />
    <text x="197.6" y="80" fill="#64748b" font-size="10" class="mono" text-anchor="middle">1.0 ms</text>

    <line x1="395.2" y1="56" x2="395.2" y2="64" stroke="#334155" stroke-width="1" />
    <text x="395.2" y="80" fill="#64748b" font-size="10" class="mono" text-anchor="middle">2.0 ms</text>

    <line x1="592.8" y1="56" x2="592.8" y2="64" stroke="#334155" stroke-width="1" />
    <text x="592.8" y="80" fill="#64748b" font-size="10" class="mono" text-anchor="middle">3.0 ms</text>

    <line x1="790.4" y1="56" x2="790.4" y2="64" stroke="#334155" stroke-width="1" />
    <text x="790.4" y="80" fill="#64748b" font-size="10" class="mono" text-anchor="middle">4.0 ms</text>

    <line x1="988" y1="56" x2="988" y2="68" stroke="#ff3366" stroke-width="2" />
    <text x="988" y="80" fill="#ff3366" font-size="10" font-weight="700" class="mono" text-anchor="middle">5.0 ms (DEADLINE)</text>

    <!-- Active Worst-Case Callout -->
    <path d="M 191 -8 L 191 -22 L 230 -22" fill="none" stroke="#ff007f" stroke-width="1.5" />
    <rect x="235" y="-32" width="170" height="20" rx="4" fill="#2d0a1b" stroke="#ff007f" stroke-width="1" />
    <text x="245" y="-18" fill="#ff77bb" font-size="10" font-weight="800" class="mono">WCET: 0.953 ms (19.1%)</text>
  </g>

  <!-- ==================== 4 TELEMETRY PILL CARDS (x=36, y=200) ==================== -->
  <g transform="translate(36, 195)">
    <!-- Card 1: Audio Frame Spec -->
    <g transform="translate(0, 0)">
      <rect width="232" height="95" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.2" />
      <text x="14" y="24" fill="#38bdf8" font-size="11" font-weight="800">AUDIO HOP CONTRACT</text>
      <text x="14" y="46" fill="#ffffff" font-size="18" font-weight="900" class="mono">5.00 ms <tspan fill="#64748b" font-size="12">/ 80 smp</tspan></text>
      <text x="14" y="66" fill="#94a3b8" font-size="10">Sampling Rate: 16,000 Hz</text>
      <text x="14" y="82" fill="#94a3b8" font-size="10">Analysis Window: 512 smp (32ms)</text>
    </g>

    <!-- Card 2: Worst Case Latency -->
    <g transform="translate(252, 0)">
      <rect width="232" height="95" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.2" />
      <text x="14" y="24" fill="#fbbf24" font-size="11" font-weight="800">MEASURED INT8 WCET</text>
      <text x="14" y="46" fill="#ffffff" font-size="18" font-weight="900" class="mono">0.953 ms <tspan fill="#34d399" font-size="12">PASS</tspan></text>
      <text x="14" y="66" fill="#94a3b8" font-size="10">Mean Hop Latency: 0.765 ms</text>
      <text x="14" y="82" fill="#94a3b8" font-size="10">99th Percentile: 1.433 ms</text>
    </g>

    <!-- Card 3: Real-Time Factor -->
    <g transform="translate(504, 0)">
      <rect width="232" height="95" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.2" />
      <text x="14" y="24" fill="#00ff88" font-size="11" font-weight="800">REAL-TIME FACTOR (RTF)</text>
      <text x="14" y="46" fill="#00ff88" font-size="18" font-weight="900" class="mono">0.153x <tspan fill="#38bdf8" font-size="12">SPEED</tspan></text>
      <text x="14" y="66" fill="#94a3b8" font-size="10">Hard Budget Bound: &lt; 1.000x</text>
      <text x="14" y="82" fill="#94a3b8" font-size="10">Throughput: 1,301.5 frames/sec</text>
    </g>

    <!-- Card 4: Hardware Target -->
    <g transform="translate(756, 0)">
      <rect width="232" height="95" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1.2" />
      <text x="14" y="24" fill="#ff77bb" font-size="11" font-weight="800">HARDWARE COMPLIANCE</text>
      <text x="14" y="46" fill="#ffffff" font-size="18" font-weight="900" class="mono">Raspberry Pi</text>
      <text x="14" y="66" fill="#94a3b8" font-size="10">BCM2711/2712 Quad ARM64</text>
      <text x="14" y="82" fill="#34d399" font-size="10" font-weight="700">Zero Audio Overruns (XRUN = 0)</text>
    </g>
  </g>
</svg>
