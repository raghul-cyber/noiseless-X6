[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26052-noiseless-x6"
version = "0.1.0"
description = "SIH26052 NOISELESS-X6 - Dual-Mic Speech Enhancement & Adaptive Noise Cancellation on Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SIH26052 Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.1.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.4.0",
    "pyyaml>=6.0",
    "soundfile>=0.12.1",
    "onnxscript>=0.1.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.9.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "backend*", "tools*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/realtime",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::torch.jit.TracerWarning",
    "ignore:.*variable length with GRU.*:UserWarning",
    "ignore:.*httpx.*",
    "ignore:.*StarletteDeprecationWarning.*",
]
